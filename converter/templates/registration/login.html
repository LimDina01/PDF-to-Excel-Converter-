<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bank Statement Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #eef0f3;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-muted: #666666;
            --input-border: #cccccc;
            --input-bg: #ffffff;
            --accent: #007bff;
            --accent-hover: #0056b3;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Open Sans', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        
        .header img {
            max-height: 120px;
            margin-bottom: 1rem;
        }
        
        h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 600;
            color: #4a5568;
        }

        .container {
            background: var(--card-bg);
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 4px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
            margin-bottom: 1.5rem;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 1.5rem;
            margin-top: 0;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-group svg {
            position: absolute;
            right: 12px;
            color: var(--text-muted);
            width: 16px;
            height: 16px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 0.85rem 2.5rem 0.85rem 1rem;
            border-radius: 4px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-color);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25);
        }

        button[type="submit"] {
            padding: 0.85rem;
            border-radius: 4px;
            background: var(--accent);
            color: white;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            margin-top: 0.5rem;
        }

        button[type="submit"]:hover {
            background: var(--accent-hover);
        }

        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 0.75rem;
            border-radius: 4px;
            text-align: center;
            margin-bottom: 1.25rem;
            font-size: 0.9rem;
        }
        
        .version {
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="header">
        {% load static %}
        <img src="{% static 'converter/img/logo.png' %}" alt="Logo">
        <h1>Bank Statement Converter</h1>
    </div>
    
    <div class="container">
        <p class="subtitle">Sign in to start your session</p>
        
        {% if form.errors %}
        <div class="error">Your username and password didn't match. Please try again.</div>
        {% endif %}
        
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="input-group">
                <input type="text" name="username" placeholder="Username" autofocus autocapitalize="none" autocomplete="username" maxlength="150" required id="id_username">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            
            <div class="input-group">
                <input type="password" name="password" placeholder="Password" autocomplete="current-password" required id="id_password">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg>
            </div>
            
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit">Sign In</button>
        </form>
    </div>
    
    <div class="version">1.0.0 Stable</div>
</body>
</html>
