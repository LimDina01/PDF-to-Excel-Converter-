<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bank Statement Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f3f6f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-muted: #64748b;
            --input-border: #e2e8f0;
            --input-bg: #ffffff;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --label-color: #334155;
            --card-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
            --border-radius: 16px;
        }

        body.dark-mode {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --input-border: #334155;
            --input-bg: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
            --label-color: #e2e8f0;
            --card-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        body {
            margin: 0;
            padding: 2rem 1rem;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease;
        }

        .theme-toggle {
            position: absolute;
            top: 1.5rem;
            right: 2rem;
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
            border-radius: 50%;
            transition: all 0.2s ease;
        }
        .theme-toggle:hover { background: rgba(0, 0, 0, 0.05); }
        body.dark-mode .theme-toggle:hover { background: rgba(255, 255, 255, 0.1); }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .header img {
            max-height: 100px;
            margin-bottom: 1rem;
        }
        
        h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 700;
            color: var(--label-color);
            letter-spacing: -0.5px;
        }

        .container {
            background: var(--card-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--border-radius);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--card-shadow);
            box-sizing: border-box;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 1.05rem;
            margin-bottom: 2rem;
            margin-top: 0;
            font-weight: 500;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-group svg {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            width: 18px;
            height: 18px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.5rem;
            border-radius: 8px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-color);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        button[type="submit"] {
            padding: 0.85rem;
            border-radius: 8px;
            background: var(--accent);
            color: white;
            font-weight: 600;
            font-size: 1.05rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            margin-top: 0.5rem;
            font-family: inherit;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.2);
        }

        button[type="submit"]:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 0.85rem;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            font-weight: 500;
        }
        
        body.dark-mode .error {
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.15);
        }
        
        .version {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" title="Toggle Dark/Light Mode">
        <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        <svg id="sunIcon" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    </button>

    <div class="header">
        {% load static %}
        <img src="{% static 'converter/img/logo.png' %}" alt="Logo">
        <h1>Bank Statement Converter</h1>
    </div>
    
    <div class="container">
        <p class="subtitle">Sign in to start your session</p>
        
        {% if form.errors %}
        <div class="error">Your username and password didn't match. Please try again.</div>
        {% endif %}
        
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="input-group">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <input type="text" name="username" placeholder="Username" autofocus autocapitalize="none" autocomplete="username" maxlength="150" required id="id_username">
            </div>
            
            <div class="input-group">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                <input type="password" name="password" placeholder="Password" autocomplete="current-password" required id="id_password">
            </div>
            
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit">Sign In</button>
        </form>
    </div>
    
    <div class="version">1.0.0 Stable</div>

    <script>
        // Theme Toggle Logic
        const themeToggle = document.getElementById('themeToggle');
        const moonIcon = document.getElementById('moonIcon');
        const sunIcon = document.getElementById('sunIcon');
        
        const currentTheme = localStorage.getItem('theme');
        if (currentTheme === 'dark') {
            document.body.classList.add('dark-mode');
            moonIcon.style.display = 'none';
            sunIcon.style.display = 'block';
        }
        
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                moonIcon.style.display = 'none';
                sunIcon.style.display = 'block';
                localStorage.setItem('theme', 'dark');
            } else {
                moonIcon.style.display = 'block';
                sunIcon.style.display = 'none';
                localStorage.setItem('theme', 'light');
            }
        });
    </script>
</body>
</html>
